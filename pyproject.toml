[project]
name = "tiger-audio-extraction"
version = "0.1.0"
description = "Local, one-click TIGER audio separation (dialogue / music / effects, two speakers)"
requires-python = "==3.10.*"
# Only what the app needs at runtime.
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "gradio[mcp]==6.31.0",
    "huggingface-hub==1.16.1",
    "safetensors==0.4.5",
    "numpy==2.0.2",
    "numba==0.60.0",
    "llvmlite==0.43.0",
    "scipy==1.14.1",
    "librosa==0.10.2.post1",
    "soundfile==0.12.1",
    "soxr==0.5.0.post1",
    "rich==13.9.4",
    "torch-complex==0.4.4",
    "typeguard==2.13.3",
    "packaging==24.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
